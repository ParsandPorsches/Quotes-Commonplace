<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Commonplace — my quotes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;1,400;1,500&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF0EA; --panel:#F7F8F4; --ink:#23202B; --muted:#5F5B66;
  --plum:#5B2A4E; --plum-soft:#EADCE5; --moss:#5E7151; --rule:#CDD3C6;
  --serif:"Spectral", Georgia, "Times New Roman", serif;
  --sans:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1B1A20; --panel:#24232B; --ink:#ECEAF0; --muted:#A7A2AF;
    --plum:#D9A3C9; --plum-soft:#3A2836; --moss:#A9BE97; --rule:#3A3842; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1B1A20; --panel:#24232B; --ink:#ECEAF0; --muted:#A7A2AF;
  --plum:#D9A3C9; --plum-soft:#3A2836; --moss:#A9BE97; --rule:#3A3842; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:22px 0 0;flex-wrap:wrap}
.top h1{font-family:var(--serif);font-weight:500;font-size:1.35rem;margin:0;letter-spacing:.01em}
#status{font-size:.85rem;color:var(--muted)}
#status::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--moss);margin-right:7px;vertical-align:1px}
#status.local::before{background:#B58A2E}

/* The stage: the one bold element */
.stage{padding:56px 0 40px;min-height:52vh;display:flex;flex-direction:column;justify-content:center}
#show{margin:0;max-width:30ch;transition:opacity .45s ease}
#show.fade{opacity:0}
#showText{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(1.9rem,4.6vw,3.4rem);line-height:1.18;letter-spacing:-.01em;text-wrap:balance;position:relative}
#showText.long{font-size:clamp(1.4rem,3vw,2.2rem);line-height:1.3}
#showText.xlong{font-size:clamp(1.15rem,2.2vw,1.6rem);line-height:1.4}
#showText::before{content:"\201C";position:absolute;left:-.55em;top:-.05em;color:var(--plum);opacity:.85}
#showBy{margin-top:22px;font-size:1.02rem;color:var(--muted)}
#showBy strong{color:var(--ink);font-weight:600}
.empty-stage{font-family:var(--serif);font-style:italic;font-size:clamp(1.5rem,3.5vw,2.4rem);color:var(--muted);max-width:24ch;margin:0}
.timer{height:2px;background:var(--rule);margin-top:40px;max-width:560px;overflow:hidden}
#bar{height:100%;width:0;background:var(--plum)}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.btn{border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:7px 15px;cursor:pointer;font-size:.92rem}
.btn:hover{border-color:var(--plum)}
.btn.primary{background:var(--plum);border-color:var(--plum);color:var(--paper);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.ctl-label{display:inline-flex;align-items:center;gap:6px;font-size:.92rem;color:var(--muted);margin-left:6px}
select{border:1px solid var(--rule);background:var(--panel);border-radius:8px;padding:6px 8px}

/* Workspace */
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:28px;padding:28px 0 64px;border-top:1px solid var(--rule)}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
h2{font-family:var(--serif);font-weight:500;font-size:1.3rem;margin:0 0 14px}
h2 small{font-family:var(--sans);font-size:.85rem;color:var(--muted);font-weight:400;margin-left:6px}
.add{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:20px;align-self:start;position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
@media (max-width:820px){.add{position:static}}
label.f{display:block;font-size:.88rem;color:var(--muted);margin:12px 0 4px}
label.f:first-of-type{margin-top:0}
textarea,input[type=text],input[type=search]{width:100%;border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:9px 11px}
textarea{min-height:120px;resize:vertical;font-family:var(--serif);font-size:1.08rem;line-height:1.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
.form-actions{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
.hint{font-size:.8rem;color:var(--muted)}
#toast{font-size:.88rem;color:var(--moss);min-height:1.3em;margin-top:8px}

.searchbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.searchbar input{flex:1 1 220px;font-size:1rem;padding:10px 12px}
.filterchip{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.88rem}
.filterchip[aria-pressed="true"]{background:var(--plum-soft);border-color:var(--plum);color:var(--ink)}
#list{list-style:none;margin:0;padding:0}
#list li{padding:16px 0;border-bottom:1px solid var(--rule)}
#list li:first-child{padding-top:4px}
.q{font-family:var(--serif);font-size:1.12rem;line-height:1.5;margin:0 0 6px;white-space:pre-wrap;overflow-wrap:anywhere}
.meta{font-size:.9rem;color:var(--muted)}
.meta strong{color:var(--ink);font-weight:600}
mark{background:var(--plum-soft);color:inherit;border-radius:2px;padding:0 1px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{border:none;background:transparent;color:var(--moss);font-size:.85rem;padding:0;cursor:pointer}
.tag:hover{text-decoration:underline}
.acts{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.act{border:none;background:transparent;color:var(--muted);font-size:.85rem;padding:4px 8px;border-radius:6px;cursor:pointer}
.act:hover{background:var(--plum-soft);color:var(--ink)}
.act.on{color:var(--plum)}
.act.danger.armed{background:#B3261E;color:#fff}
.lib-empty{color:var(--muted);padding:20px 0;font-size:.95rem}
.backup{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;align-items:center}
.backup label{cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){#show{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Commonplace</h1>
    <span id="status">Loading your quotes…</span>
  </header>

  <section class="stage" aria-label="Quote rotation">
    <div id="stageBody"></div>
    <div class="timer" aria-hidden="true"><div id="bar"></div></div>
    <div class="controls">
      <button class="btn" id="prevBtn" aria-label="Previous quote">Previous</button>
      <button class="btn" id="pauseBtn">Pause</button>
      <button class="btn" id="nextBtn" aria-label="Next quote">Next</button>
      <label class="ctl-label">Every
        <select id="interval">
          <option value="8000">8 sec</option>
          <option value="15000" selected>15 sec</option>
          <option value="30000">30 sec</option>
          <option value="60000">1 min</option>
          <option value="300000">5 min</option>
        </select>
      </label>
      <label class="ctl-label"><input type="checkbox" id="favOnly"> Favorites only</label>
    </div>
  </section>

  <main class="grid">
    <section class="add" aria-labelledby="addH">
      <h2 id="addH">Add a quote</h2>
      <form id="form" autocomplete="off">
        <label class="f" for="qText">Quote</label>
        <textarea id="qText" required placeholder="Type or paste the words you want to keep"></textarea>
        <div class="row2">
          <div><label class="f" for="qAuthor">Who said it</label><input type="text" id="qAuthor" list="authorList"></div>
          <div><label class="f" for="qSource">Where from</label><input type="text" id="qSource" placeholder="Book, talk, friend…"></div>
        </div>
        <label class="f" for="qTags">Tags</label>
        <input type="text" id="qTags" placeholder="courage, work, family">
        <datalist id="authorList"></datalist>
        <div class="form-actions">
          <button class="btn primary" type="submit" id="saveBtn">Save quote</button>
          <button class="btn" type="button" id="cancelEdit" hidden>Cancel edit</button>
          <span class="hint">Ctrl/⌘ + Enter saves</span>
        </div>
        <div id="toast" role="status"></div>
      </form>
    </section>

    <section aria-labelledby="libH">
      <h2 id="libH">Your quotes <small id="count"></small></h2>
      <div class="searchbar">
        <label for="search" class="sr">Search quotes</label>
        <input type="search" id="search" placeholder="Search words, authors, sources, tags  ( / )">
        <button class="filterchip" id="favFilter" aria-pressed="false">Favorites</button>
        <select id="sort" aria-label="Sort quotes">
          <option value="new">Newest first</option>
          <option value="old">Oldest first</option>
          <option value="author">By author</option>
        </select>
      </div>
      <ul id="list"></ul>
      <div class="backup">
        <button class="btn" id="exportBtn">Download backup</button>
        <label class="btn" for="importFile">Restore from backup</label>
        <input type="file" id="importFile" accept="application/json,.json" class="sr">
      </div>
    </section>
  </main>
</div>

<script>
(() => {
  const LOCAL_KEY = 'commonplace.quotes.v1';
  const PREF_KEY = 'commonplace.prefs.v1';
  const $ = id => document.getElementById(id);

  let quotes = [];
  let col = null;          // db collection when synced
  let downloads = null;
  let mode = 'pending';    // 'db' | 'local' | 'pending'
  let editingId = null;

  // ---------- storage ----------
  const readLocal = () => { try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]') || []; } catch { return []; } };
  const writeLocal = () => { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(quotes)); } catch {} };
  const clearLocal = () => { try { localStorage.removeItem(LOCAL_KEY); } catch {} };
  const newId = () => 'q' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  function clean(q) {
    return {
      text: String(q.text || '').trim(),
      author: String(q.author || '').trim(),
      source: String(q.source || '').trim(),
      tags: Array.isArray(q.tags) ? q.tags.map(t => String(t).trim().toLowerCase()).filter(Boolean) : [],
      fav: !!q.fav,
      createdAt: Number(q.createdAt) || Date.now(),
      updatedAt: Date.now()
    };
  }

  async function persist(id, data) {
    const i = quotes.findIndex(q => q.id === id);
    if (i >= 0) quotes[i] = { id, ...data }; else quotes.unshift({ id, ...data });
    renderAll();
    if (mode === 'db') {
      try { await col.doc(id).set(data); }
      catch (e) { flash(e && e.code === 'quota_exceeded' ? 'Storage is full. Delete some quotes to add more.' : 'Couldn’t sync that change. Check your connection and try again.', true); }
    } else writeLocal();
  }

  async function removeQuote(id) {
    quotes = quotes.filter(q => q.id !== id);
    renderAll();
    if (mode === 'db') { try { await col.doc(id).delete(); } catch { flash('Couldn’t delete. Try again.', true); } }
    else writeLocal();
  }

  function setStatus() {
    const s = $('status');
    if (mode === 'db') { s.textContent = 'Synced to your Claude account'; s.className = ''; }
    else if (mode === 'local') { s.textContent = 'Saved in this browser'; s.className = 'local'; }
  }

  async function connect() {
    let db = null, user = null;
    if (window.claude && typeof window.claude.use === 'function') {
      try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch {}
      try { downloads = await window.claude.use('downloads'); } catch {}
    }
    const uid = user ? await user.id().catch(() => null) : null;
    if (!db || !uid) { useLocal(); return; }

    col = db.collection('data/users/' + uid);
    let first = true;
    col.onSnapshot(async snap => {
      const incoming = snap.docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() }));
      if (first) {
        first = false;
        mode = 'db'; setStatus();
        // Move anything saved earlier in browser-only mode into the account
        const local = readLocal();
        if (local.length) {
          const have = new Set(incoming.map(q => q.id));
          for (const q of local) if (!have.has(q.id)) { try { await col.doc(q.id).set(clean(q)); } catch {} }
          clearLocal();
        }
      }
      quotes = incoming;
      renderAll();
    }, () => { if (mode !== 'db') useLocal(); });
  }

  function useLocal() {
    if (mode === 'local') return;
    mode = 'local'; col = null;
    quotes = readLocal();
    setStatus(); renderAll();
  }

  // ---------- helpers ----------
  const sorted = list => {
    const s = $('sort').value;
    const out = [...list];
    if (s === 'old') out.sort((a, b) => a.createdAt - b.createdAt);
    else if (s === 'author') out.sort((a, b) => (a.author || '~').localeCompare(b.author || '~') || b.createdAt - a.createdAt);
    else out.sort((a, b) => b.createdAt - a.createdAt);
    return out;
  };
  const tokens = () => $('search').value.toLowerCase().split(/\s+/).filter(Boolean);
  const hay = q => [q.text, q.author, q.source, (q.tags || []).join(' ')].join(' ').toLowerCase();
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  function highlight(el, text, toks) {
    el.textContent = '';
    if (!toks.length || !text) { el.textContent = text || ''; return; }
    const re = new RegExp('(' + toks.map(reEsc).join('|') + ')', 'gi');
    text.split(re).forEach((part, i) => {
      if (!part) return;
      if (i % 2) { const m = document.createElement('mark'); m.textContent = part; el.appendChild(m); }
      else el.appendChild(document.createTextNode(part));
    });
  }

  let toastTimer;
  function flash(msg, warn) {
    const t = $('toast'); t.textContent = msg; t.style.color = warn ? '#B3261E' : '';
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.textContent = '', 3500);
  }

  // ---------- library ----------
  function renderList() {
    const toks = tokens();
    const favOnly = $('favFilter').getAttribute('aria-pressed') === 'true';
    const shown = sorted(quotes).filter(q => (!favOnly || q.fav) && toks.every(t => hay(q).includes(t)));
    $('count').textContent = quotes.length ? (shown.length === quotes.length ? quotes.length + ' saved' : shown.length + ' of ' + quotes.length) : '';
    const ul = $('list'); ul.textContent = '';

    if (mode === 'pending') { ul.innerHTML = '<li class="lib-empty">Loading…</li>'; return; }
    if (!quotes.length) { ul.innerHTML = '<li class="lib-empty">Nothing here yet. Add your first quote and it will show up in this list and in the rotation above.</li>'; return; }
    if (!shown.length) { ul.innerHTML = '<li class="lib-empty">No quotes match that search. Try fewer words or clear the Favorites filter.</li>'; return; }

    for (const q of shown) {
      const li = document.createElement('li');
      const p = document.createElement('p'); p.className = 'q'; highlight(p, q.text, toks); li.appendChild(p);
      if (q.author || q.source) {
        const m = document.createElement('div'); m.className = 'meta';
        if (q.author) { const s = document.createElement('strong'); highlight(s, q.author, toks); m.appendChild(s); }
        if (q.author && q.source) m.appendChild(document.createTextNode(', '));
        if (q.source) { const s = document.createElement('span'); highlight(s, q.source, toks); m.appendChild(s); }
        li.appendChild(m);
      }
      if (q.tags && q.tags.length) {
        const tg = document.createElement('div'); tg.className = 'tags';
        q.tags.forEach(t => { const b = document.createElement('button'); b.className = 'tag'; b.textContent = '#' + t; b.onclick = () => { $('search').value = t; renderList(); }; tg.appendChild(b); });
        li.appendChild(tg);
      }
      const acts = document.createElement('div'); acts.className = 'acts';
      const mk = (label, fn, cls) => { const b = document.createElement('button'); b.className = 'act ' + (cls || ''); b.textContent = label; b.onclick = fn; acts.appendChild(b); return b; };
      mk('Show', () => { showQuote(q.id, true); window.scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); });
      const fav = mk(q.fav ? '★ Favorite' : '☆ Favorite', () => persist(q.id, { ...clean(q), fav: !q.fav, createdAt: q.createdAt }), q.fav ? 'on' : '');
      fav.setAttribute('aria-pressed', q.fav ? 'true' : 'false');
      mk('Edit', () => startEdit(q));
      const del = mk('Delete', () => {
        if (del.classList.contains('armed')) { removeQuote(q.id); return; }
        del.classList.add('armed'); del.textContent = 'Confirm delete';
        setTimeout(() => { del.classList.remove('armed'); del.textContent = 'Delete'; }, 3000);
      }, 'danger');
      li.appendChild(acts);
      ul.appendChild(li);
    }
  }

  function renderAuthors() {
    const dl = $('authorList'); dl.textContent = '';
    [...new Set(quotes.map(q => q.author).filter(Boolean))].sort().forEach(a => { const o = document.createElement('option'); o.value = a; dl.appendChild(o); });
  }

  // ---------- add / edit ----------
  function startEdit(q) {
    editingId = q.id;
    $('qText').value = q.text; $('qAuthor').value = q.author || ''; $('qSource').value = q.source || '';
    $('qTags').value = (q.tags || []).join(', ');
    $('addH').textContent = 'Edit quote'; $('saveBtn').textContent = 'Save changes'; $('cancelEdit').hidden = false;
    $('qText').focus();
  }
  function resetForm() {
    editingId = null; $('form').reset();
    $('addH').textContent = 'Add a quote'; $('saveBtn').textContent = 'Save quote'; $('cancelEdit').hidden = true;
  }
  $('cancelEdit').onclick = resetForm;
  $('form').addEventListener('submit', e => {
    e.preventDefault();
    const text = $('qText').value.trim();
    if (!text) { flash('Add the quote text first.', true); $('qText').focus(); return; }
    if (mode === 'pending') { flash('Still loading. Try again in a moment.', true); return; }
    const existing = editingId && quotes.find(q => q.id === editingId);
    const data = clean({
      text, author: $('qAuthor').value, source: $('qSource').value,
      tags: $('qTags').value.split(','), fav: existing ? existing.fav : false,
      createdAt: existing ? existing.createdAt : Date.now()
    });
    const id = editingId || newId();
    const wasEdit = !!editingId;
    persist(id, data);
    resetForm();
    flash(wasEdit ? 'Changes saved.' : 'Quote saved.');
    $('qText').focus();
  });
  $('qText').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('form').requestSubmit(); });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $('search').focus(); }
  });
  $('search').addEventListener('input', renderList);
  $('sort').addEventListener('change', renderList);
  $('favFilter').onclick = () => { const b = $('favFilter'); b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); renderList(); };

  // ---------- rotation ----------
  let deck = [], history = [], current = null, paused = false, elapsed = 0, last = performance.now();
  const pool = () => $('favOnly').checked ? quotes.filter(q => q.fav) : quotes;
  const interval = () => Number($('interval').value);

  function refillDeck() {
    deck = pool().map(q => q.id);
    for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
    if (deck.length > 1 && deck[deck.length - 1] === current) deck.unshift(deck.pop());
  }
  function nextQuote() {
    const ids = new Set(pool().map(q => q.id));
    deck = deck.filter(id => ids.has(id));
    if (!deck.length) refillDeck();
    const id = deck.pop();
    if (id) showQuote(id);
    else renderStage();
  }
  function prevQuote() {
    if (history.length < 2) return;
    history.pop();
    const id = history.pop();
    showQuote(id);
  }
  function showQuote(id, manual) {
    current = id; history.push(id); if (history.length > 50) history.shift();
    elapsed = 0;
    const fig = $('show');
    if (fig && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      fig.classList.add('fade');
      setTimeout(renderStage, 300);
    } else renderStage();
    if (manual && paused) togglePause();
  }
  function renderStage() {
    const body = $('stageBody');
    const q = quotes.find(x => x.id === current);
    body.textContent = '';
    if (mode === 'pending') return;
    if (!q) {
      const p = document.createElement('p'); p.className = 'empty-stage';
      p.textContent = quotes.length ? 'Mark a few quotes as favorites to see them here, or turn off “Favorites only.”' : 'The quotes you save will take turns appearing here.';
      body.appendChild(p); return;
    }
    const fig = document.createElement('figure'); fig.id = 'show'; fig.classList.add('fade');
    const bq = document.createElement('blockquote'); bq.id = 'showText'; bq.textContent = q.text;
    if (q.text.length > 380) bq.classList.add('xlong'); else if (q.text.length > 170) bq.classList.add('long');
    fig.appendChild(bq);
    if (q.author || q.source) {
      const cap = document.createElement('figcaption'); cap.id = 'showBy';
      if (q.author) { const s = document.createElement('strong'); s.textContent = q.author; cap.appendChild(s); }
      if (q.author && q.source) cap.appendChild(document.createTextNode(', '));
      if (q.source) cap.appendChild(document.createTextNode(q.source));
      fig.appendChild(cap);
    }
    body.appendChild(fig);
    requestAnimationFrame(() => fig.classList.remove('fade'));
  }
  function togglePause() {
    paused = !paused;
    $('pauseBtn').textContent = paused ? 'Resume' : 'Pause';
    savePrefs();
  }
  function tick(now) {
    const dt = now - last; last = now;
    if (!paused && !document.hidden && pool().length > 1) {
      elapsed += dt;
      if (elapsed >= interval()) nextQuote();
    }
    $('bar').style.width = (pool().length > 1 ? Math.min(100, elapsed / interval() * 100) : 0) + '%';
    requestAnimationFrame(tick);
  }
  $('nextBtn').onclick = () => nextQuote();
  $('prevBtn').onclick = () => prevQuote();
  $('pauseBtn').onclick = togglePause;
  $('interval').onchange = () => { elapsed = 0; savePrefs(); };
  $('favOnly').onchange = () => { refillDeck(); savePrefs(); nextQuote(); };

  function savePrefs() { try { localStorage.setItem(PREF_KEY, JSON.stringify({ interval: $('interval').value, favOnly: $('favOnly').checked, paused })); } catch {} }
  function loadPrefs() {
    try {
      const p = JSON.parse(localStorage.getItem(PREF_KEY) || 'null'); if (!p) return;
      if (p.interval) $('interval').value = p.interval;
      $('favOnly').checked = !!p.favOnly;
      if (p.paused) togglePause();
    } catch {}
  }

  function renderAll() {
    renderList(); renderAuthors();
    const inPool = pool().some(q => q.id === current);
    if (!inPool) nextQuote(); else renderStage();
  }

  // ---------- backup ----------
  $('exportBtn').onclick = async () => {
    const json = JSON.stringify({ app: 'commonplace', exported: new Date().toISOString(), quotes }, null, 2);
    const name = 'quotes-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    if (downloads) {
      try { await downloads.save({ filename: name, data: json }); }
      catch (e) { if (e && e.code !== 'declined') flash('Couldn’t download the backup right now.', true); }
      return;
    }
    if (window.claude) { flash('Downloading isn’t available in this view.', true); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $('importFile').onchange = async e => {
    const file = e.target.files[0]; e.target.value = '';
    if (!file) return;
    try {
      const parsed = JSON.parse(await file.text());
      const list = Array.isArray(parsed) ? parsed : parsed.quotes;
      if (!Array.isArray(list)) throw 0;
      const have = new Set(quotes.map(q => q.id));
      let added = 0;
      for (const q of list) {
        if (!q || !q.text) continue;
        const id = q.id && !have.has(q.id) && /^[\w.~:@+-]{1,100}$/.test(q.id) ? q.id : (have.has(q.id) ? null : newId());
        if (!id) continue;
        await persist(id, clean(q)); have.add(id); added++;
      }
      flash(added ? `Restored ${added} quote${added === 1 ? '' : 's'}.` : 'Every quote in that backup is already here.');
    } catch { flash('That file isn’t a quotes backup.', true); }
  };

  // ---------- start ----------
  loadPrefs();
  renderAll();
  requestAnimationFrame(t => { last = t; tick(t); });
  connect();
})();
</script>
</body>
</html>
